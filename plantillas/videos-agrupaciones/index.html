<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos Agrupaciones — Cantina Todos Santos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">

  <style>
    /* ================================================
       PLANTILLA HORIZONTAL 1920x1080 — VIDEOS DE AGRUPACIONES
       Anfitriones (arriba, centrados): El Destape de las Estrellas · Cantina Todos Santos
       Patrocinadores (abajo): CUU Studio (centro) · Dayvasos
       Todas las animaciones duran 6 s o un divisor de 6 s → bucle perfecto.
       ================================================ */

    /* ---- COLORES CANTINA TODOS SANTOS ---- */
    :root {
      --cts-cafe:     #2A1A10;   /* fondo café sólido */
      --cts-dorado:   #B98A3C;
      --cts-naranja:  #F2A33A;
      --cts-crema:    #EFE7DA;
      --cts-gris:     #A8998A;
      --cts-linea:    rgba(185, 138, 60, 0.35);

      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-caps:  'Archivo', 'Helvetica Neue', sans-serif;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #000;
      color: var(--cts-crema);
      font-family: var(--font-caps);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- LIENZO 16:9 (se escala a la ventana) ---- */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: grid;
      grid-template-rows: 225px 1fr 165px;
    }

    /* ---- FONDO: café sólido + silueta giratoria gigante ---- */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--cts-cafe);
    }
    .bg__glow {
      position: absolute;
      left: 50%;
      top: -300px;
      width: 1400px;
      height: 700px;
      margin-left: -700px;
      background: radial-gradient(ellipse at center, rgba(242, 163, 58, 0.16), transparent 70%);
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    .bg__ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1900px;
      height: 1900px;
      margin: -950px 0 0 -950px;
    }
    .bg__ring svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ring-seal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1780px;
      height: 1780px;
      margin: -890px 0 0 -890px;
      opacity: 0.16;
      animation: spin180 6s linear infinite;   /* el texto del sello se repite 2 veces: 180° = bucle */
    }
    @keyframes spin180 { to { transform: rotate(180deg); } }
    .ring-dash {
      transform-origin: 950px 950px;
      animation: spin-30 6s linear infinite;
    }
    @keyframes spin-30 { to { transform: rotate(-30deg); } }

    /* Chispas doradas que suben */
    .ember {
      position: absolute;
      bottom: -10px;
      border-radius: 50%;
      background: var(--cts-naranja);
      box-shadow: 0 0 8px 2px rgba(242, 163, 58, 0.55);
      opacity: 0;
      animation: rise 6s linear infinite;
      animation-delay: var(--d0, 0s);
    }
    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: var(--o); }
      50%  { transform: translate(var(--dx), -560px); }
      85%  { opacity: var(--o); }
      100% { transform: translate(0, -1120px); opacity: 0; }
    }

    .caps {
      font-family: var(--font-caps);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.32em;
    }

    /* ---- ARRIBA: ANFITRIONES, CENTRADOS ---- */
    .hosts {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 46px;
      padding-top: 10px;
    }
    .host {
      width: 420px;
      height: 210px;
      animation: shine 3s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
    }
    #logo-cantina { --d0: -1.5s; }
    .host svg, .host img { width: 100%; height: 100%; object-fit: contain; display: block; overflow: visible; }
    @keyframes shine {
      0%, 100% { filter: drop-shadow(0 4px 14px rgba(247, 201, 72, 0.18)) brightness(1); }
      50%      { filter: drop-shadow(0 4px 28px rgba(247, 201, 72, 0.45)) brightness(1.1); }
    }
    .hosts__sep {
      width: 2px;
      height: 130px;
      background: linear-gradient(180deg, transparent, var(--cts-dorado), transparent);
    }

    /* ---- CENTRO: VIDEO ---- */
    .middle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0 4px;
    }
    .video-frame {
      position: relative;
      height: 100%;
      aspect-ratio: 16 / 9;
      padding: 4px;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 90px rgba(242, 163, 58, 0.12);
    }
    /* Borde dorado con brillo que recorre el marco (solo el borde; el centro queda libre) */
    .video-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 4px;
      border-radius: 12px;
      background: conic-gradient(from var(--angle),
        rgba(185, 138, 60, 0.5) 0deg,
        var(--cts-naranja) 30deg,
        #FFE2A8 45deg,
        var(--cts-naranja) 60deg,
        rgba(185, 138, 60, 0.5) 100deg,
        rgba(185, 138, 60, 0.5) 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: sweep 6s linear infinite;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes sweep { to { --angle: 360deg; } }

    .video-frame__inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #0B0806;
    }
    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .video-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      cursor: pointer;
    }
    .video-empty b { font-family: var(--font-serif); font-weight: 400; font-size: 46px; color: var(--cts-crema); }
    .video-empty span { font-size: 15px; color: var(--cts-gris); }
    .has-video .video-empty { display: none; }

    .badge {
      position: absolute;
      top: 22px;
      left: 22px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 99px;
      background: rgba(17, 11, 8, 0.8);
      border: 1px solid var(--cts-linea);
      font-size: 14px;
      color: var(--cts-dorado);
    }
    .badge i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cts-naranja);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* ---- ABAJO: PATROCINADORES (CUU Studio al centro) ---- */
    .bottom {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto auto auto 1fr;
      align-items: center;
      gap: 48px;
      padding: 12px 90px 10px;
    }
    .bottom::before {
      content: "";
      position: absolute;
      left: 280px; right: 280px; top: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cts-linea), transparent);
    }
    .sponsors__label { font-size: 15px; color: var(--cts-gris); white-space: nowrap; justify-self: end; }
    .sponsor {
      height: 96px;
      width: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spotlight 6s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
    }
    .sponsor--main { width: 400px; }
    #logo-dayvasos { --d0: -3s; justify-self: start; }
    .sponsor svg, .sponsor img { height: 100%; width: 100%; object-fit: contain; overflow: visible; display: block; }
    @keyframes spotlight {
      0%, 50%, 100% { opacity: 0.8; transform: scale(1); filter: none; }
      15%, 35%      { opacity: 1;   transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(242, 163, 58, 0.35)); }
    }
    .sponsor-sep { width: 1px; height: 64px; background: var(--cts-linea); }

    /* ---- PANEL DE CONTROL (se oculta solo) ---- */
    .controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 32px);
      padding: 10px;
      border-radius: 12px;
      background: rgba(20, 14, 10, 0.94);
      border: 1px solid var(--cts-linea);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      transition: opacity 0.3s;
    }
    .controls button, .controls label.btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #3A2716;
      color: var(--cts-crema);
      font: inherit;
      cursor: pointer;
    }
    .controls button:hover, .controls label.btn:hover { background: #4A321C; }
    .controls input[type="file"] { display: none; }
    body.idle .controls, body.overlay .controls, body.export .controls { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }

    /* Modo overlay (?overlay=1): el hueco del video queda transparente */
    body.overlay { background: transparent; }
    body.overlay .video-frame__inner { background: transparent; }
    body.overlay .video-empty,
    body.overlay video { display: none; }

    /* Modo exportar (?export=1): animaciones congeladas y movidas cuadro a cuadro con --t */
    body.export *, body.export *::before, body.export *::after {
      animation-play-state: paused !important;
      animation-delay: calc(var(--d0, 0s) - var(--t, 0s)) !important;
    }
  </style>
</head>
<body>

  <!-- Degradados compartidos por los logos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF4C2"/>
        <stop offset="0.35" stop-color="#F7C948"/>
        <stop offset="0.62" stop-color="#C98A12"/>
        <stop offset="0.8" stop-color="#F2BE3A"/>
        <stop offset="1" stop-color="#FFE38A"/>
      </linearGradient>
      <linearGradient id="oroMic" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF1B0"/>
        <stop offset="0.5" stop-color="#E9AE2A"/>
        <stop offset="1" stop-color="#9C6508"/>
      </linearGradient>
      <linearGradient id="cuuDot" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5B7CFA"/>
        <stop offset="1" stop-color="#E879F9"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="stage" id="stage">
    <div class="bg" id="bg">
      <div class="bg__glow"></div>
      <div class="bg__ring" aria-hidden="true">
        <svg viewBox="0 0 1900 1900">
          <circle cx="950" cy="950" r="900" fill="none" stroke="#B98A3C" stroke-opacity="0.12" stroke-width="3"/>
          <g class="ring-dash">
            <circle cx="950" cy="950" r="740" fill="none" stroke="#B98A3C" stroke-opacity="0.16" stroke-width="10"
                    stroke-dasharray="4 34.75"/>
          </g>
          <circle cx="950" cy="950" r="700" fill="none" stroke="#B98A3C" stroke-opacity="0.1" stroke-width="2"/>
        </svg>
        <!-- Silueta real del sello Todos Santos (anillo de texto), girando -->
        <img class="ring-seal" src="logos/sello-anillo-oro.png" alt="">
      </div>
      <div id="embers"></div>
    </div>

    <!-- ARRIBA: anfitriones -->
    <header class="hosts">
      <!-- El Destape de las Estrellas -->
      <div class="host" id="logo-destape" data-png="logos/el-destape-de-las-estrellas.png">
        <svg viewBox="0 0 1000 500" role="img" aria-label="El Destape de las Estrellas">
          <defs>
            <path id="arcDestape" d="M50,420 Q500,370 950,420"/>
            <path id="arcEstrellas" d="M200,488 Q500,452 800,488"/>
          </defs>
          <path d="M480,20 L527,150 L665,150 L553,232 L407,232 L295,150 L433,150 Z"
                fill="none" stroke="#3A2400" stroke-width="40" stroke-linejoin="miter"/>
          <path d="M480,20 L527,150 L665,150 L553,232 L407,232 L295,150 L433,150 Z"
                fill="none" stroke="url(#oro)" stroke-width="26" stroke-linejoin="miter"/>
          <g transform="translate(600 120) rotate(22)">
            <rect x="-14" y="62" width="28" height="70" rx="6" fill="url(#oroMic)" stroke="#3A2400" stroke-width="6"/>
            <rect x="-50" y="-80" width="100" height="150" rx="50" fill="url(#oroMic)" stroke="#3A2400" stroke-width="7"/>
            <g stroke="#5A3A00" stroke-width="7" stroke-linecap="round">
              <line x1="-30" y1="-50" x2="30" y2="-50"/><line x1="-36" y1="-32" x2="36" y2="-32"/>
              <line x1="-38" y1="-14" x2="38" y2="-14"/><line x1="-38" y1="4" x2="38" y2="4"/>
              <line x1="-38" y1="22" x2="38" y2="22"/><line x1="-34" y1="40" x2="34" y2="40"/>
            </g>
            <circle cx="22" cy="100" r="9" fill="url(#oroMic)" stroke="#3A2400" stroke-width="4"/>
          </g>
          <g font-family="DM Serif Display, serif" stroke="#3A2400" stroke-width="14" paint-order="stroke" stroke-linejoin="round" fill="url(#oro)">
            <text x="118" y="262" font-size="92">EL</text>
            <text font-size="215"><textPath href="#arcDestape" textLength="900" lengthAdjust="spacingAndGlyphs">DESTAPE</textPath></text>
          </g>
          <text font-family="Archivo, sans-serif" font-weight="800" font-size="54" letter-spacing="3" stroke="#3A2400" stroke-width="10" paint-order="stroke" stroke-linejoin="round" fill="url(#oro)"><textPath href="#arcEstrellas" textLength="600" lengthAdjust="spacingAndGlyphs">DE LAS ESTRELLAS</textPath></text>
        </svg>
      </div>

      <div class="hosts__sep"></div>

      <!-- Cantina Todos Santos (misma textura dorada) -->
      <div class="host" id="logo-cantina" data-png="logos/cantina-todos-santos.png">
        <svg viewBox="0 0 1000 500" role="img" aria-label="Cantina Todos Santos">
          <g stroke="#3A2400" stroke-linejoin="round" paint-order="stroke" fill="url(#oro)">
            <text x="500" y="150" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="74" letter-spacing="34" stroke-width="10">CANTINA</text>
            <text x="500" y="318" text-anchor="middle" font-family="DM Serif Display, serif" font-size="196" stroke-width="14" textLength="920" lengthAdjust="spacingAndGlyphs">TODOS</text>
            <text x="500" y="470" text-anchor="middle" font-family="DM Serif Display, serif" font-size="196" stroke-width="14" textLength="920" lengthAdjust="spacingAndGlyphs">SANTOS</text>
          </g>
          <g fill="url(#oro)" stroke="#3A2400" stroke-width="5">
            <path d="M70,128 h120 v10 h-120 z"/>
            <path d="M810,128 h120 v10 h-120 z"/>
          </g>
        </svg>
      </div>
    </header>

    <!-- CENTRO: video -->
    <main class="middle">
      <div class="video-frame" id="videoFrame">
        <div class="video-frame__inner" id="videoBox">
          <video id="video" playsinline autoplay muted></video>
          <label class="video-empty" for="fileInput">
            <b>Arrastra aquí los videos de las agrupaciones</b>
            <span class="caps">o haz clic para elegirlos · se reproducen en orden y en bucle</span>
          </label>
          <div class="badge caps"><i></i>En lo que instalamos el sonido…</div>
        </div>
      </div>
    </main>

    <!-- ABAJO: patrocinadores -->
    <footer class="bottom">
      <div class="sponsors__label caps">Patrocinan</div>
      <div class="sponsor-sep"></div>

      <!-- CUU Studio (marca: punto degradado azul→morado + Bricolage Grotesque) -->
      <div class="sponsor sponsor--main" id="logo-cuu" data-png="logos/cuu-studio.png">
        <svg viewBox="0 0 330 96" role="img" aria-label="CUU Studio">
          <circle cx="36" cy="48" r="13" fill="url(#cuuDot)"/>
          <text x="64" y="63" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="44" letter-spacing="1" fill="#FFFFFF">CUU STUDIO</text>
        </svg>
      </div>

      <div class="sponsor-sep"></div>

      <!-- Dayvasos -->
      <div class="sponsor" id="logo-dayvasos" data-png="logos/dayvasos.png">
        <svg viewBox="0 0 330 96" role="img" aria-label="Dayvasos">
          <g transform="translate(14 14)">
            <path d="M38,40 L52,-12" stroke="#EFE7DA" stroke-width="4" stroke-linecap="round"/>
            <path d="M4,12 L56,12 L49,66 Q48,70 44,70 L16,70 Q12,70 11,66 Z" fill="none" stroke="#F2A33A" stroke-width="4" stroke-linejoin="round"/>
            <path d="M4,12 L56,12 L55,20 Q48,26 42,19 Q36,27 30,19 Q24,27 18,19 Q12,26 5,20 Z" fill="#F2A33A"/>
            <path d="M13,36 L47,36" stroke="#B98A3C" stroke-width="2" opacity="0.8"/>
            <circle cx="22" cy="50" r="3" fill="#B98A3C"/>
            <circle cx="36" cy="56" r="2.2" fill="#B98A3C"/>
            <circle cx="40" cy="44" r="2.6" fill="#B98A3C"/>
          </g>
          <text x="96" y="64" font-family="DM Serif Display, serif" font-size="50" fill="#EFE7DA">Day<tspan font-style="italic" fill="#F2A33A">vasos</tspan></text>
        </svg>
      </div>
    </footer>
  </div>

  <!-- Controles -->
  <div class="controls">
    <label class="btn" for="fileInput">🎬 Elegir videos</label>
    <input type="file" id="fileInput" accept="video/*" multiple>
    <button id="btnSonido">🔇 Activar sonido</button>
    <button id="btnSiguiente">⏭ Siguiente</button>
    <button id="btnFull">⛶ Pantalla completa</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('video');
    const videoBox = document.getElementById('videoBox');
    const fileInput = document.getElementById('fileInput');
    const btnSonido = document.getElementById('btnSonido');
    const params = new URLSearchParams(location.search);

    if (params.get('overlay') === '1') document.body.classList.add('overlay');
    if (params.get('export') === '1') document.body.classList.add('export');

    // Chispas: posiciones fijas (semilla), duración 6 s → bucle perfecto
    (function makeEmbers() {
      let seed = 7;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const box = document.getElementById('embers');
      for (let i = 0; i < 34; i++) {
        const e = document.createElement('span');
        const size = 2 + rnd() * 3.5;
        e.className = 'ember';
        e.style.left = (rnd() * 100) + '%';
        e.style.width = e.style.height = size + 'px';
        e.style.setProperty('--d0', (-rnd() * 6).toFixed(3) + 's');
        e.style.setProperty('--dx', ((rnd() - 0.5) * 120) + 'px');
        e.style.setProperty('--o', (0.35 + rnd() * 0.5).toFixed(2));
        box.appendChild(e);
      }
    })();

    // Si existe el logo original en logos/ (PNG), se usa en lugar de la versión vectorial
    document.querySelectorAll('[data-png]').forEach(slot => {
      const img = new Image();
      img.onload = () => {
        img.alt = slot.querySelector('svg')?.getAttribute('aria-label') || '';
        slot.querySelector('svg').replaceWith(img);
      };
      img.src = slot.dataset.png;
    });

    // Escalar el lienzo 1920x1080 a la ventana
    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = `scale(${s})`;
    }
    addEventListener('resize', fit);
    fit();

    // Overlay: recorta el fondo para que el hueco del video sea transparente
    function cutHole() {
      if (!document.body.classList.contains('overlay')) return;
      const st = stage.getBoundingClientRect();
      const s = st.width / 1920;
      const r = document.getElementById('videoFrame').getBoundingClientRect();
      const x = (r.left - st.left) / s + 4, y = (r.top - st.top) / s + 4;
      const w = r.width / s - 8, h = r.height / s - 8, k = 8;
      const hole = `M${x + k},${y} H${x + w - k} Q${x + w},${y} ${x + w},${y + k} V${y + h - k} Q${x + w},${y + h} ${x + w - k},${y + h} H${x + k} Q${x},${y + h} ${x},${y + h - k} V${y + k} Q${x},${y} ${x + k},${y} Z`;
      document.getElementById('bg').style.clipPath = `path(evenodd, "M0,0 H1920 V1080 H0 Z ${hole}")`;
    }
    document.fonts.ready.then(cutHole);
    addEventListener('resize', cutHole);

    // Lista de reproducción
    let playlist = [];
    let current = 0;

    function playIndex(i) {
      if (!playlist.length) return;
      current = (i + playlist.length) % playlist.length;
      video.src = playlist[current];
      video.play().catch(() => {});
    }

    function loadFiles(files) {
      const vids = [...files].filter(f => f.type.startsWith('video/'));
      if (!vids.length) return;
      playlist.forEach(u => URL.revokeObjectURL(u));
      playlist = vids.map(f => URL.createObjectURL(f));
      videoBox.classList.add('has-video');
      playIndex(0);
    }

    fileInput.addEventListener('change', e => loadFiles(e.target.files));
    video.addEventListener('ended', () => playIndex(current + 1));
    document.getElementById('btnSiguiente').addEventListener('click', () => playIndex(current + 1));

    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => { e.preventDefault(); loadFiles(e.dataTransfer.files); });

    btnSonido.addEventListener('click', () => {
      video.muted = !video.muted;
      btnSonido.textContent = video.muted ? '🔇 Activar sonido' : '🔊 Silenciar';
    });

    document.getElementById('btnFull').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    // Atajos: F pantalla completa, M sonido, flechas siguiente/anterior
    addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') document.getElementById('btnFull').click();
      if (e.key === 'm' || e.key === 'M') btnSonido.click();
      if (e.key === 'ArrowRight') playIndex(current + 1);
      if (e.key === 'ArrowLeft') playIndex(current - 1);
    });

    // Ocultar controles y cursor tras 3 s sin mover el mouse
    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
    }
    addEventListener('mousemove', wake);
    wake();
  </script>
</body>
</html>
