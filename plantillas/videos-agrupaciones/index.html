<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos Agrupaciones — Cantina Todos Santos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">

  <style>
    /* ================================================
       PLANTILLA HORIZONTAL 1920x1080 — VIDEOS DE AGRUPACIONES
       Anfitriones (arriba, centrados): El Destape de las Estrellas · Cantina Todos Santos
       Patrocinadores (abajo): CUU Studio (centro) · Dayvasos
       Todas las animaciones duran 6 s o un divisor de 6 s → bucle perfecto.
       ================================================ */

    /* ---- COLORES CANTINA TODOS SANTOS ---- */
    :root {
      --cts-cafe:     #2A1A10;   /* fondo café sólido */
      --cts-dorado:   #B98A3C;
      --cts-naranja:  #F2A33A;
      --cts-crema:    #EFE7DA;
      --cts-gris:     #A8998A;
      --cts-linea:    rgba(185, 138, 60, 0.35);

      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-caps:  'Archivo', 'Helvetica Neue', sans-serif;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #000;
      color: var(--cts-crema);
      font-family: var(--font-caps);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- LIENZO 16:9 (se escala a la ventana) ---- */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: grid;
      grid-template-rows: 222px 1fr 178px;
    }

    /* ---- FONDO: café sólido + silueta giratoria gigante ---- */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--cts-cafe);
    }
    .bg__glow {
      position: absolute;
      left: 50%;
      top: -300px;
      width: 1400px;
      height: 700px;
      margin-left: -700px;
      background: radial-gradient(ellipse at center, rgba(242, 163, 58, 0.16), transparent 70%);
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    .bg__ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1900px;
      height: 1900px;
      margin: -950px 0 0 -950px;
    }
    .bg__ring svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ring-seal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1780px;
      height: 1780px;
      margin: -890px 0 0 -890px;
      opacity: 0.16;
      animation: spin180 6s linear infinite;   /* el texto del sello se repite 2 veces: 180° = bucle */
    }
    @keyframes spin180 { to { transform: rotate(180deg); } }
    .ring-dash {
      transform-origin: 950px 950px;
      animation: spin-30 6s linear infinite;
    }
    @keyframes spin-30 { to { transform: rotate(-30deg); } }

    /* Chispas doradas que suben */
    .ember {
      position: absolute;
      bottom: -10px;
      border-radius: 50%;
      background: var(--cts-naranja);
      box-shadow: 0 0 8px 2px rgba(242, 163, 58, 0.55);
      opacity: 0;
      animation: rise 6s linear infinite;
      animation-delay: var(--d0, 0s);
    }
    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: var(--o); }
      50%  { transform: translate(var(--dx), -560px); }
      85%  { opacity: var(--o); }
      100% { transform: translate(0, -1120px); opacity: 0; }
    }

    .caps {
      font-family: var(--font-caps);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.32em;
    }

    /* ---- ARRIBA: ANFITRIONES, CENTRADOS ---- */
    .hosts {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 46px;
      padding-top: 10px;
    }
    .host {
      height: 200px;
      animation: shine 3s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
    }
    #logo-cantina { --d0: -1.5s; height: 180px; }
    .host img { height: 100%; width: auto; display: block; }
    @keyframes shine {
      0%, 100% { filter: drop-shadow(0 4px 14px rgba(247, 201, 72, 0.18)) brightness(1); }
      50%      { filter: drop-shadow(0 4px 28px rgba(247, 201, 72, 0.45)) brightness(1.1); }
    }
    .hosts__sep {
      width: 2px;
      height: 130px;
      background: linear-gradient(180deg, transparent, var(--cts-dorado), transparent);
    }

    /* ---- CENTRO: VIDEO ---- */
    .middle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0 4px;
    }
    .video-frame {
      position: relative;
      height: 100%;
      aspect-ratio: 16 / 9;
      padding: 4px;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 90px rgba(242, 163, 58, 0.12);
    }
    /* Borde dorado con brillo que recorre el marco (solo el borde; el centro queda libre) */
    .video-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 4px;
      border-radius: 12px;
      background: conic-gradient(from var(--angle),
        rgba(185, 138, 60, 0.5) 0deg,
        var(--cts-naranja) 30deg,
        #FFE2A8 45deg,
        var(--cts-naranja) 60deg,
        rgba(185, 138, 60, 0.5) 100deg,
        rgba(185, 138, 60, 0.5) 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: sweep 6s linear infinite;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes sweep { to { --angle: 360deg; } }

    .video-frame__inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #0B0806;
    }
    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .video-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      cursor: pointer;
    }
    .video-empty b { font-family: var(--font-serif); font-weight: 400; font-size: 46px; color: var(--cts-crema); }
    .video-empty span { font-size: 15px; color: var(--cts-gris); }
    .has-video .video-empty { display: none; }

    .badge {
      position: absolute;
      top: 22px;
      left: 22px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 99px;
      background: rgba(17, 11, 8, 0.8);
      border: 1px solid var(--cts-linea);
      font-size: 14px;
      color: var(--cts-dorado);
    }
    .badge i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cts-naranja);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* ---- ABAJO: PATROCINADORES (CUU Studio al centro, movimiento suave) ---- */
    .bottom {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto auto auto 1fr;
      align-items: center;
      gap: 56px;
      padding: 14px 90px 8px;
    }
    .bottom::before {
      content: "";
      position: absolute;
      left: 280px; right: 280px; top: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cts-linea), transparent);
    }
    .sponsors__label {
      position: absolute;
      left: 90px;
      top: 50%;
      font-size: 14px;
      color: var(--cts-gris);
      white-space: nowrap;
      transform: translateY(-50%);
    }
    .sponsor {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spotlight 6s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
    }
    #logo-dayvasos { justify-self: end; }
    #logo-botas { justify-self: start; }
    .sponsor--main { height: 118px; }
    .wig {
      height: 100%;
      animation: wiggle 3s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
      transform-origin: 50% 60%;
    }
    .wig img, .wig svg { height: 100%; width: auto; display: block; }
    .sponsor--main .wig svg { width: 113px; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25%      { transform: rotate(2.5deg) translateY(-3px); }
      50%      { transform: rotate(0deg) translateY(0); }
      75%      { transform: rotate(-2.5deg) translateY(-3px); }
    }
    @keyframes spotlight {
      0%, 50%, 100% { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35)); }
      15%, 35%      { filter: drop-shadow(0 0 22px rgba(242, 163, 58, 0.45)); }
    }
    .cuu-flow { animation: cuu-flow 6s linear infinite; animation-delay: var(--d0, 0s); }
    @keyframes cuu-flow { to { transform: translateX(660px); } }
    .sponsor-sep { width: 1px; height: 80px; background: var(--cts-linea); }

    /* ---- PANEL DE CONTROL (se oculta solo) ---- */
    .controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 32px);
      padding: 10px;
      border-radius: 12px;
      background: rgba(20, 14, 10, 0.94);
      border: 1px solid var(--cts-linea);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      transition: opacity 0.3s;
    }
    .controls button, .controls label.btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #3A2716;
      color: var(--cts-crema);
      font: inherit;
      cursor: pointer;
    }
    .controls button:hover, .controls label.btn:hover { background: #4A321C; }
    .controls input[type="file"] { display: none; }
    body.idle .controls, body.overlay .controls, body.export .controls { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }

    /* Modo overlay (?overlay=1): el hueco del video queda transparente */
    body.overlay { background: transparent; }
    body.overlay .video-frame__inner { background: transparent; }
    body.overlay .video-empty,
    body.overlay video { display: none; }

    /* Modo chroma (?chroma=1): el recuadro del video es verde puro para quitarlo con chroma key */
    body.chroma .video-frame__inner { background: #00FF00; }
    body.chroma .video-empty,
    body.chroma video { display: none; }

    /* Placa del nombre del grupo: queda vacía para escribir el nombre en el editor */
    .nameplate {
      display: none;
      position: absolute;
      left: 34px;
      bottom: 34px;
      z-index: 4;
      width: 640px;
      height: 112px;
      padding: 16px 30px;
      border-radius: 10px;
      background: linear-gradient(90deg, #1A1009, #2A1A10);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    body.placa .nameplate { display: block; }
    .nameplate::before {            /* borde dorado */
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: 10px;
      background: linear-gradient(90deg, #F7C948, #B98A3C 60%, rgba(185, 138, 60, 0.3));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }
    .nameplate::after {             /* destello que recorre la placa */
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      left: -220px;
      width: 160px;
      background: linear-gradient(100deg, transparent, rgba(255, 226, 168, 0.18), transparent);
      animation: plate-shine 6s ease-in-out infinite;
    }
    @keyframes plate-shine {
      0%, 55% { transform: translateX(0); }
      100%    { transform: translateX(1100px); }
    }
    .nameplate__label { font-size: 15px; color: var(--cts-naranja); }
    .nameplate__name {
      margin-top: 8px;
      font-family: var(--font-serif);
      font-size: 46px;
      line-height: 1.1;
      color: var(--cts-crema);
      white-space: nowrap;
    }

    /* Modo sin recuadro (?sinrecuadro=1): centro libre para escribir los nombres de los artistas */
    body.sinrecuadro .video-frame { visibility: hidden; }

    /* En los videos exportados el recuadro va limpio, sin etiqueta */
    body.export .badge { display: none; }

    /* Modo exportar (?export=1): animaciones congeladas y movidas cuadro a cuadro con --t */
    /* ---- MODO VERTICAL (?vertical=1): video 9:16 al centro, pantalla horizontal ----
       Anfitriones a la izquierda, patrocinadores a la derecha */
    body.vertical .stage { display: block; }
    body.vertical .hosts {
      position: absolute;
      left: 40px; top: 0; bottom: 0;
      width: 600px;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      padding: 0;
    }
    body.vertical .host { height: 230px; }
    body.vertical #logo-cantina { height: 205px; }
    body.vertical .hosts__sep {
      width: 320px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cts-dorado), transparent);
    }
    body.vertical .middle {
      position: absolute;
      left: 50%; top: 36px; bottom: 36px;
      transform: translateX(-50%);
      padding: 0;
    }
    body.vertical .video-frame { aspect-ratio: 9 / 16; height: 100%; }
    body.vertical .video-empty b { font-size: 34px; padding: 0 30px; }
    body.vertical .video-empty span { font-size: 12px; padding: 0 30px; }
    body.vertical .bottom {
      position: absolute;
      right: 40px; top: 0; bottom: 0;
      width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 0;
    }
    body.vertical .bottom::before { display: none; }
    body.vertical .sponsors__label { position: static; transform: none; font-size: 16px; }
    body.vertical .sponsor-sep { width: 240px; height: 1px; background: linear-gradient(90deg, transparent, var(--cts-linea), transparent); }
    body.vertical #logo-dayvasos { height: 200px; }
    body.vertical .sponsor--main { height: 150px; }
    body.vertical .sponsor--main .wig svg { width: 144px; }
    body.vertical #logo-botas { height: 190px; }

    body.export *, body.export *::before, body.export *::after {
      animation-play-state: paused !important;
      animation-delay: calc(var(--d0, 0s) - var(--t, 0s)) !important;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="bg" id="bg">
      <div class="bg__glow"></div>
      <div class="bg__ring" aria-hidden="true">
        <svg viewBox="0 0 1900 1900">
          <circle cx="950" cy="950" r="900" fill="none" stroke="#B98A3C" stroke-opacity="0.12" stroke-width="3"/>
          <g class="ring-dash">
            <circle cx="950" cy="950" r="740" fill="none" stroke="#B98A3C" stroke-opacity="0.16" stroke-width="10"
                    stroke-dasharray="4 34.75"/>
          </g>
          <circle cx="950" cy="950" r="700" fill="none" stroke="#B98A3C" stroke-opacity="0.1" stroke-width="2"/>
        </svg>
        <!-- Silueta real del sello Todos Santos (anillo de texto), girando -->
        <img class="ring-seal" src="logos/sello-anillo-oro.png" alt="">
      </div>
      <div id="embers"></div>
    </div>

    <!-- ARRIBA: anfitriones -->
    <header class="hosts">
      <div class="host" id="logo-destape"><img src="logos/el-destape-de-las-estrellas.png" alt="El Destape de las Estrellas"></div>
      <div class="hosts__sep"></div>
      <div class="host" id="logo-cantina"><img src="logos/cantina-todos-santos.png" alt="Cantina Todos Santos"></div>
    </header>

    <!-- CENTRO: video -->
    <main class="middle">
      <div class="video-frame" id="videoFrame">
        <div class="video-frame__inner" id="videoBox">
          <video id="video" playsinline autoplay muted></video>
          <label class="video-empty" for="fileInput">
            <b>Arrastra aquí los videos de las agrupaciones</b>
            <span class="caps">o haz clic para elegirlos · se reproducen en orden y en bucle</span>
          </label>
          <div class="badge caps"><i></i>En lo que instalamos el sonido…</div>
        </div>
        <!-- Placa para el nombre del grupo (?placa=1, opcional &nombre=...) -->
        <div class="nameplate" id="nameplate">
          <div class="nameplate__label caps">Ahora en el escenario</div>
          <div class="nameplate__name" id="nombre"></div>
        </div>
      </div>
    </main>

    <!-- ABAJO: patrocinadores -->
    <footer class="bottom">
      <div class="sponsors__label caps">Patrocinan</div>

      <div class="sponsor" id="logo-dayvasos" style="--d0:0s">
        <div class="wig" style="--d0:0s"><img src="logos/dayvasos.png" alt="Dayvasos JN"></div>
      </div>
      <div class="sponsor-sep"></div>

      <!-- CUU Studio: silueta del texto rellena con morado/azul en movimiento -->
      <div class="sponsor sponsor--main" id="logo-cuu" style="--d0:-2s">
        <div class="wig" style="--d0:-1s">
          <svg viewBox="0 0 660 690" role="img" aria-label="CUU Studio">
            <defs>
              <mask id="cuuMask" maskUnits="userSpaceOnUse" x="0" y="0" width="660" height="690">
                <image href="logos/cuu-studio-silueta.png" x="0" y="0" width="660" height="690"/>
              </mask>
              <linearGradient id="cuuFlow" x1="0" y1="0" x2="1" y2="0.25">
                <stop offset="0"     stop-color="#5B7CFA"/>
                <stop offset="0.167" stop-color="#E879F9"/>
                <stop offset="0.333" stop-color="#5B7CFA"/>
                <stop offset="0.5"   stop-color="#A78BFA"/>
                <stop offset="0.667" stop-color="#5B7CFA"/>
                <stop offset="0.833" stop-color="#E879F9"/>
                <stop offset="1"     stop-color="#5B7CFA"/>
              </linearGradient>
            </defs>
            <g mask="url(#cuuMask)">
              <rect class="cuu-flow" x="-1320" y="-100" width="1980" height="890" fill="url(#cuuFlow)"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="sponsor-sep"></div>

      <div class="sponsor" id="logo-botas" style="--d0:-4s">
        <div class="wig" style="--d0:-2s"><img src="logos/botas-el-jefee.png" alt="Botas El Jefee"></div>
      </div>
    </footer>
  </div>

  <!-- Controles -->
  <div class="controls">
    <label class="btn" for="fileInput">🎬 Elegir videos</label>
    <input type="file" id="fileInput" accept="video/*" multiple>
    <button id="btnSonido">🔇 Activar sonido</button>
    <button id="btnSiguiente">⏭ Siguiente</button>
    <button id="btnFull">⛶ Pantalla completa</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('video');
    const videoBox = document.getElementById('videoBox');
    const fileInput = document.getElementById('fileInput');
    const btnSonido = document.getElementById('btnSonido');
    const params = new URLSearchParams(location.search);

    if (params.get('overlay') === '1') document.body.classList.add('overlay');
    if (params.get('export') === '1') document.body.classList.add('export');
    if (params.get('chroma') === '1') document.body.classList.add('chroma');
    if (params.get('sinrecuadro') === '1') document.body.classList.add('sinrecuadro');
    if (params.get('vertical') === '1') document.body.classList.add('vertical');
    if (params.get('placa') === '1' || params.get('nombre')) document.body.classList.add('placa');
    if (params.get('nombre')) document.getElementById('nombre').textContent = params.get('nombre');

    // Chispas: posiciones fijas (semilla), duración 6 s → bucle perfecto
    (function makeEmbers() {
      let seed = 7;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const box = document.getElementById('embers');
      for (let i = 0; i < 34; i++) {
        const e = document.createElement('span');
        const size = 2 + rnd() * 3.5;
        e.className = 'ember';
        e.style.left = (rnd() * 100) + '%';
        e.style.width = e.style.height = size + 'px';
        e.style.setProperty('--d0', (-rnd() * 6).toFixed(3) + 's');
        e.style.setProperty('--dx', ((rnd() - 0.5) * 120) + 'px');
        e.style.setProperty('--o', (0.35 + rnd() * 0.5).toFixed(2));
        box.appendChild(e);
      }
    })();

    // Escalar el lienzo 1920x1080 a la ventana
    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = `scale(${s})`;
    }
    addEventListener('resize', fit);
    fit();

    // Overlay: recorta el fondo para que el hueco del video sea transparente
    function cutHole() {
      if (!document.body.classList.contains('overlay')) return;
      const st = stage.getBoundingClientRect();
      const s = st.width / 1920;
      const r = document.getElementById('videoFrame').getBoundingClientRect();
      const x = (r.left - st.left) / s + 4, y = (r.top - st.top) / s + 4;
      const w = r.width / s - 8, h = r.height / s - 8, k = 8;
      const hole = `M${x + k},${y} H${x + w - k} Q${x + w},${y} ${x + w},${y + k} V${y + h - k} Q${x + w},${y + h} ${x + w - k},${y + h} H${x + k} Q${x},${y + h} ${x},${y + h - k} V${y + k} Q${x},${y} ${x + k},${y} Z`;
      document.getElementById('bg').style.clipPath = `path(evenodd, "M0,0 H1920 V1080 H0 Z ${hole}")`;
    }
    document.fonts.ready.then(cutHole);
    addEventListener('resize', cutHole);

    // Lista de reproducción
    let playlist = [];
    let current = 0;

    function playIndex(i) {
      if (!playlist.length) return;
      current = (i + playlist.length) % playlist.length;
      video.src = playlist[current];
      video.play().catch(() => {});
    }

    function loadFiles(files) {
      const vids = [...files].filter(f => f.type.startsWith('video/'));
      if (!vids.length) return;
      playlist.forEach(u => URL.revokeObjectURL(u));
      playlist = vids.map(f => URL.createObjectURL(f));
      videoBox.classList.add('has-video');
      playIndex(0);
    }

    fileInput.addEventListener('change', e => loadFiles(e.target.files));
    video.addEventListener('ended', () => playIndex(current + 1));
    document.getElementById('btnSiguiente').addEventListener('click', () => playIndex(current + 1));

    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => { e.preventDefault(); loadFiles(e.dataTransfer.files); });

    btnSonido.addEventListener('click', () => {
      video.muted = !video.muted;
      btnSonido.textContent = video.muted ? '🔇 Activar sonido' : '🔊 Silenciar';
    });

    document.getElementById('btnFull').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    // Atajos: F pantalla completa, M sonido, flechas siguiente/anterior
    addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') document.getElementById('btnFull').click();
      if (e.key === 'm' || e.key === 'M') btnSonido.click();
      if (e.key === 'ArrowRight') playIndex(current + 1);
      if (e.key === 'ArrowLeft') playIndex(current - 1);
    });

    // Ocultar controles y cursor tras 3 s sin mover el mouse
    let idleTimer;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
    }
    addEventListener('mousemove', wake);
    wake();
  </script>
</body>
</html>
