<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texto 3D Grupero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
  <style>
    /* ================================================
       TEXTO 3D DORADO EN ARCO (estilo flyer grupero) — FONDO VERDE PARA CHROMA KEY
       Uso: index.html?texto=Doble%20Firma   (usa | para elegir dónde partir los renglones)
       Todas las animaciones duran 6 s o un divisor → bucle perfecto.
       ================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #00FF00;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      perspective: 1800px;
      background: #00FF00;
    }
    #art {
      width: 1920px;
      height: 1080px;
      display: block;
      transform-origin: 50% 55%;
      animation: sway 6s ease-in-out infinite;
      animation-delay: var(--d0, 0s);
    }
    @keyframes sway {
      0%, 100% { transform: rotateY(-7deg) rotateX(5deg) scale(1); }
      50%      { transform: rotateY(7deg)  rotateX(5deg) scale(1.03); }
    }
    .txt { font-family: 'Rye', 'Rockwell Extra Bold', serif; }
    .shine-band { animation: shine 3s ease-in-out infinite; animation-delay: var(--d0, 0s); }
    @keyframes shine {
      0%, 25%   { transform: translateX(-900px); }
      75%, 100% { transform: translateX(2100px); }
    }
    .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; animation-delay: var(--d0, 0s); }
    @keyframes twinkle {
      0%, 55%, 100% { opacity: 0; transform: scale(0.1) rotate(0deg); }
      72%           { opacity: 1; transform: scale(1) rotate(45deg); }
      88%           { opacity: 0; transform: scale(0.2) rotate(90deg); }
    }
    /* Modo exportar: animaciones movidas cuadro a cuadro con --t */
    body.export *, body.export *::before, body.export *::after {
      animation-play-state: paused !important;
      animation-delay: calc(var(--d0, 0s) - var(--t, 0s)) !important;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <svg id="art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Arcos (sonrisa invertida) para cada renglón -->
        <path id="arc1" d="M 260 600 Q 960 250 1660 600"/>
        <path id="arc2" d="M 330 900 Q 960 590 1590 900"/>

        <!-- Cara dorada, un degradado por renglón -->
        <linearGradient id="face1" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="610">
          <stop offset="0" stop-color="#FFEFA8"/><stop offset="0.18" stop-color="#FFCC45"/>
          <stop offset="0.42" stop-color="#D38A0C"/><stop offset="0.49" stop-color="#4A2800"/>
          <stop offset="0.54" stop-color="#8A560A"/><stop offset="0.72" stop-color="#E6A824"/>
          <stop offset="0.9" stop-color="#FFD164"/><stop offset="1" stop-color="#FFEBA6"/>
        </linearGradient>
        <linearGradient id="face2" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="910">
          <stop offset="0" stop-color="#FFEFA8"/><stop offset="0.18" stop-color="#FFCC45"/>
          <stop offset="0.42" stop-color="#D38A0C"/><stop offset="0.49" stop-color="#4A2800"/>
          <stop offset="0.54" stop-color="#8A560A"/><stop offset="0.72" stop-color="#E6A824"/>
          <stop offset="0.9" stop-color="#FFD164"/><stop offset="1" stop-color="#FFEBA6"/>
        </linearGradient>
        <!-- Aro dorado exterior -->
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF0A8"/><stop offset="0.5" stop-color="#C98A12"/><stop offset="1" stop-color="#FFE38A"/>
        </linearGradient>

        <!-- Bisel metálico: relieve con luz especular sobre la cara -->
        <filter id="bevel" x="-5%" y="-10%" width="110%" height="120%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
          <feSpecularLighting in="blur" surfaceScale="7" specularConstant="0.55" specularExponent="30" lighting-color="#FFF6D6" result="spec">
            <feDistantLight azimuth="235" elevation="38"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
          <feDiffuseLighting in="blur" surfaceScale="7" diffuseConstant="1" lighting-color="#FFFFFF" result="diff">
            <feDistantLight azimuth="235" elevation="50"/>
          </feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="lit"/>
          <feComposite in="lit" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0" result="shiny"/>
          <feComposite in="shiny" in2="SourceAlpha" operator="in"/>
        </filter>

        <clipPath id="faceClip"><use href="#txt"/></clipPath>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <!-- El texto (se llena con JS) -->
        <g id="txt" class="txt">
          <text id="t1" class="txt" text-anchor="middle"><textPath href="#arc1" startOffset="50%" id="tp1"></textPath></text>
          <text id="t2" class="txt" text-anchor="middle"><textPath href="#arc2" startOffset="50%" id="tp2"></textPath></text>
        </g>
      </defs>

      <g id="layers"></g>

      <!-- Destellos -->
      <g id="sparks"></g>
    </svg>
  </div>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const params = new URLSearchParams(location.search);
    if (params.get('export') === '1') document.body.classList.add('export');

    const texto = (params.get('texto') || 'Doble Firma').toUpperCase().trim();
    let lines;
    if (texto.includes('|')) lines = texto.split('|').map(s => s.trim());
    else {
      const w = texto.split(/\s+/);
      lines = w.length > 1 ? [w.slice(0, Math.ceil(w.length / 2)).join(' '), w.slice(Math.ceil(w.length / 2)).join(' ')] : [texto];
    }

    const DEPTH = 26;   // profundidad de la extrusión 3D (px)
    const lerp = (a, b, t) => Math.round(a + (b - a) * t);
    const mix = (c1, c2, t) => `rgb(${lerp(c1[0], c2[0], t)},${lerp(c1[1], c2[1], t)},${lerp(c1[2], c2[2], t)})`;

    function el(tag, attrs, parent) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent && parent.appendChild(e);
      return e;
    }

    document.fonts.ready.then(() => {
      const tp1 = document.getElementById('tp1'), tp2 = document.getElementById('tp2');
      const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
      tp1.textContent = lines[0];
      tp2.textContent = lines[1] || '';
      if (lines.length === 1) {               // un solo renglón: lo centramos en un arco intermedio
        document.getElementById('arc1').setAttribute('d', 'M 220 760 Q 960 380 1700 760');
      }

      // Ajuste automático del tamaño a lo largo de cada arco
      const fitLine = (t, maxLen, maxSize) => {
        t.setAttribute('font-size', 100);
        const len = t.getComputedTextLength();
        t.setAttribute('font-size', Math.min(maxSize, Math.floor(100 * maxLen / len)));
      };
      // medimos en un clon visible (los <defs> no se miden)
      const probe = el('g', { class: 'txt', opacity: 0 }, document.getElementById('art'));
      const p1 = el('text', { class: 'txt' }, probe); p1.textContent = lines[0];
      const p2 = el('text', { class: 'txt' }, probe); p2.textContent = lines[1] || '';
      fitLine(p1, lines.length === 1 ? 1300 : 1180, lines.length === 1 ? 300 : 250);
      fitLine(p2, 1080, 250);
      t1.setAttribute('font-size', p1.getAttribute('font-size'));
      t2.setAttribute('font-size', p2.getAttribute('font-size'));
      t1.setAttribute('letter-spacing', 4); t2.setAttribute('letter-spacing', 4);
      probe.remove();

      const layers = document.getElementById('layers');

      // 1) Aro dorado exterior alrededor de todo el bloque 3D
      for (let k = 0; k <= DEPTH; k += 3)
        el('use', { href: '#txt', transform: `translate(0 ${k})`, fill: 'url(#rim)', stroke: 'url(#rim)', 'stroke-width': 38, 'stroke-linejoin': 'round' }, layers);
      // 2) Contorno negro grueso
      for (let k = 0; k <= DEPTH; k += 3)
        el('use', { href: '#txt', transform: `translate(0 ${k})`, fill: '#120A02', stroke: '#120A02', 'stroke-width': 26, 'stroke-linejoin': 'round' }, layers);
      // 3) Extrusión 3D: capas sólidas que se oscurecen hacia el fondo
      const top = [176, 112, 16], bottom = [70, 38, 4];
      for (let k = DEPTH; k >= 1; k--)
        el('use', { href: '#txt', transform: `translate(0 ${k})`, fill: mix(top, bottom, k / DEPTH), stroke: mix(top, bottom, k / DEPTH), 'stroke-width': 4, 'stroke-linejoin': 'round' }, layers);
      // 4) Filo oscuro entre la cara y la extrusión
      el('use', { href: '#txt', fill: 'none', stroke: '#3A2200', 'stroke-width': 6, 'stroke-linejoin': 'round' }, layers);
      // 5) Cara dorada con bisel metálico
      const face = el('g', { filter: 'url(#bevel)' }, layers);
      const f1 = el('use', { href: '#t1', fill: 'url(#face1)' }, face);
      const f2 = el('use', { href: '#t2', fill: 'url(#face2)' }, face);
      // 6) Brillo que recorre las letras
      const shineG = el('g', { 'clip-path': 'url(#faceClip)' }, layers);
      el('rect', { class: 'shine-band', x: 0, y: 200, width: 260, height: 800, fill: 'url(#band)', transform: 'skewX(-20)' }, shineG);
      // 7) Línea de luz en el borde superior de la cara
      el('use', { href: '#txt', fill: 'none', stroke: '#FFF8D8', 'stroke-width': 1.5, 'stroke-opacity': 0.7, transform: 'translate(-1 -1)' }, layers);

      // Ornamentos estilo cartel western: estrella arriba y filete con estrella abajo
      const fb = face.getBBox();
      const orn = el('g', {}, document.getElementById('layers'));
      const starPath = (cx, cy, r) => {
        let d = '';
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
          d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
        }
        return d + 'Z';
      };
      const cx = fb.x + fb.width / 2, topY = fb.y - 34, botY = fb.y + fb.height + 52;
      const ornStroke = { stroke: '#120A02', 'stroke-width': 10, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
      // estrella superior con rayitas a los lados
      [['path', { d: starPath(cx, topY, 40), fill: 'url(#rim)', ...ornStroke }]].forEach(([t, a]) => el(t, a, orn));
      [-1, 1].forEach(sx => {
        el('path', { d: `M ${cx + sx * 60} ${topY} L ${cx + sx * 260} ${topY}`, fill: 'none', ...ornStroke }, orn);
        el('path', { d: `M ${cx + sx * 60} ${topY} L ${cx + sx * 260} ${topY}`, fill: 'none', stroke: '#EDBE4E', 'stroke-width': 4, 'stroke-linecap': 'round' }, orn);
        el('circle', { cx: cx + sx * 280, cy: topY, r: 9, fill: 'url(#rim)', stroke: '#120A02', 'stroke-width': 5 }, orn);
      });
      // filete inferior curvo con estrella al centro
      const w2 = fb.width * 0.36;
      [-1, 1].forEach(sx => {
        const d = `M ${cx + sx * 60} ${botY} Q ${cx + sx * w2 * 0.6} ${botY - 6} ${cx + sx * w2} ${botY - 34}`;
        el('path', { d, fill: 'none', ...ornStroke }, orn);
        el('path', { d, fill: 'none', stroke: '#EDBE4E', 'stroke-width': 4, 'stroke-linecap': 'round' }, orn);
        el('path', { d: starPath(cx + sx * (w2 + 14), botY - 40, 14), fill: 'url(#rim)', stroke: '#120A02', 'stroke-width': 5, 'stroke-linejoin': 'round' }, orn);
      });
      el('path', { d: starPath(cx, botY, 30), fill: 'url(#rim)', ...ornStroke }, orn);
      el('path', { d: starPath(cx, botY, 30), fill: 'url(#rim)' }, orn);
      el('path', { d: starPath(cx, topY, 40), fill: 'url(#rim)' }, orn);

      // Destellos en algunas letras
      const bb = face.getBBox();
      const sparks = document.getElementById('sparks');
      const star = 'M0,-50 C6,-8 8,-6 50,0 C8,6 6,8 0,50 C-6,8 -8,6 -50,0 C-8,-6 -6,-8 0,-50Z';
      [[0.14, 0.32, 0], [0.47, 0.06, -1], [0.83, 0.3, -2], [0.3, 0.78, -1.5], [0.7, 0.72, -0.5]].forEach(([x, y, d]) => {
        const g = el('g', { transform: `translate(${bb.x + x * bb.width} ${bb.y + y * bb.height})` }, sparks);
        const s = el('g', { class: 'spark', style: `--d0:${d}s` }, g);
        el('path', { d: star, fill: '#FFFBEA', transform: 'scale(0.9)' }, s);
        el('circle', { r: 10, fill: '#FFFFFF' }, s);
      });
      document.body.dataset.ready = '1';
    });

    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      document.getElementById('stage').style.transform = `scale(${s})`;
    }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
