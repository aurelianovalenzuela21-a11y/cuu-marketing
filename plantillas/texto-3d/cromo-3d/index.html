<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#00FF00;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { TessellateModifier } from 'three/addons/modifiers/TessellateModifier.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const P = new URLSearchParams(location.search);
const TEXT = (P.get('texto') || 'Doble Firma').toUpperCase();
const METAL = P.get('metal') || 'plata';
const FONT = P.get('fuente') || 'Rye';
const W = 1920, H = 1080, LOOP = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.setClearColor(0x00ff00, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
camera.position.set(0, 0, 9.2);

// --- Entorno para reflejos cromados: estudio oscuro con paneles de luz y horizonte brillante
function buildEnv() {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x0b0b0e);
  const box = (w, h, d, x, y, z, color, intensity, ry = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity) }));
    m.position.set(x, y, z); m.rotation.y = ry; env.add(m);
  };
  // suelo y techo oscuros, con franja de horizonte brillante (look cromo)
  box(60, 0.6, 60, 0, -8, 0, 0x2a2018, 1);
  box(60, 1.2, 0.5, 0, 0.2, -14, 0xffffff, 3.2);            // horizonte detrás
  box(10, 0.6, 6, 0, 9, 0, 0xffffff, 4);                    // softbox superior
  box(0.4, 14, 3, -12, 2, 2, 0xffd9a0, 3, 0.3);             // tiras laterales cálidas
  box(0.4, 14, 3, 12, 2, 2, 0xcfe0ff, 2.6, -0.3);
  box(4, 4, 0.3, -7, 5, 10, 0xffffff, 5);                   // destellos fuertes
  box(3, 3, 0.3, 8, -3, 10, 0xffc070, 3);
  box(30, 4, 0.3, 0, -4.5, -12, 0x3a1a08, 1);               // reflejo café/rojizo abajo
  // frente (lo que reflejan las caras de las letras): cielo claro, horizonte oscuro, piso cálido
  box(60, 9, 0.5, 0, 5.4, 15, 0xf4f6ff, 1.7);
  box(60, 1.6, 0.5, 0, 0.3, 15, 0x08080a, 1);
  box(60, 6, 0.5, 0, -3.2, 15, 0x7a4a22, 1.4);
  box(60, 0.35, 0.4, 0, -0.25, 14.8, 0xffffff, 4);
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildEnv(), 0.02).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe0b0, 1.4); rim.position.set(5, -3, 6); scene.add(rim);

const metalColor = METAL === 'oro' ? 0xf6c25a : 0xf2f2f6;
const faceMat = new THREE.MeshPhysicalMaterial({ color: metalColor, metalness: 1, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.35 });
const edgeMat = new THREE.MeshPhysicalMaterial({ color: METAL === 'oro' ? 0x9a6a1c : 0x55555c, metalness: 1, roughness: 0.3, envMapIntensity: 1.0 });
const backMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.6, roughness: 0.5 });

// Curva el texto en arco (las letras de los extremos bajan)
function bend(geo, R, c) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const a = x / R, r = R + y;
    // curvatura vertical (cara abombada) para que el cromo tenga cielo, horizonte y piso
    pos.setXYZ(i, r * Math.sin(a), r * Math.cos(a) - R, z - c * y * y);
  }
  pos.needsUpdate = true; geo.computeVertexNormals();
}
function makeLine(font, str, size, R, opts) {
  let g = new TextGeometry(str, { font, size, depth: opts.depth, curveSegments: 14,
    bevelEnabled: true, bevelThickness: opts.bt, bevelSize: opts.bs, bevelSegments: opts.seg });
  g.computeBoundingBox(); const bb = g.boundingBox;
  g.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, 0);
  g = new TessellateModifier(0.04, 8).modify(g.index ? g.toNonIndexed() : g);
  bend(g, R, 0.55 / size);
  return g;
}

let group;
new TTFLoader().load('fonts/' + FONT + '.ttf', json => {
  const font = new Font(json);
  const words = TEXT.split(/\s+/);
  const lines = TEXT.includes('|') ? TEXT.split('|') : (words.length > 1 ? [words.slice(0, Math.ceil(words.length/2)).join(' '), words.slice(Math.ceil(words.length/2)).join(' ')] : [TEXT]);
  group = new THREE.Group(); scene.add(group);
  const targetW = [4.3, 4.0];
  lines.forEach((ln, i) => {
    // medir ancho para ajustar el tamaño
    const probe = new TextGeometry(ln, { font, size: 1, depth: 0.01, curveSegments: 2 }); probe.computeBoundingBox();
    const w = probe.boundingBox.max.x - probe.boundingBox.min.x;
    const size = Math.min(1.45, targetW[Math.min(i, 1)] / w);
    const R = 5.2 + i * 0.6;
    const y = lines.length === 1 ? 0 : (i === 0 ? 0.66 : -0.72);
    const face = new THREE.Mesh(makeLine(font, ln, size, R, { depth: 0.32 * size, bt: 0.07 * size, bs: 0.045 * size, seg: 6 }), faceMat);
    const back = new THREE.Mesh(makeLine(font, ln, size, R, { depth: 0.2 * size, bt: 0.02, bs: 0.095 * size, seg: 3 }), backMat);
    face.position.y = back.position.y = y;
    back.position.z = -0.14 * size;
    group.add(back, face);
  });
  window.renderAt(0);
  document.body.dataset.ready = '1';
});

window.renderAt = (t) => {
  const p = (t % LOOP) / LOOP, a = Math.PI * 2 * p;
  if (group) {
    group.rotation.y = 0.2 * Math.sin(a);
    group.rotation.x = -0.12 + 0.04 * Math.sin(a * 2);
    group.position.y = 0.05 * Math.sin(a * 2);
  }
  scene.environmentRotation.y = 0.55 * Math.sin(a);   // los reflejos se deslizan sobre el metal
  scene.environmentRotation.x = 0.12 * Math.sin(a * 2);
  renderer.render(scene, camera);
};
</script>
</body></html>
