<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<title>CUU Tacos — Flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fire: #FF4D00;
    --ember: #FFB800;
    --chili: #C8102E;
    --char: #0F0C0A;
    --cream: #FFF4E2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; }
  .flyer {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% 108%, rgba(255,77,0,.55), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,184,0,.35), transparent 70%),
      radial-gradient(circle at 20% 10%, #2a1d16, transparent 55%),
      var(--char);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 70px 80px 0;
  }
  /* papel picado */
  .picado { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; }
  .picado span { flex: 1; clip-path: polygon(0 0,100% 0,100% 70%,50% 100%,0 70%); margin: 0 3px; }
  .picado span:nth-child(4n+1){background:var(--fire)}
  .picado span:nth-child(4n+2){background:var(--ember)}
  .picado span:nth-child(4n+3){background:var(--chili)}
  .picado span:nth-child(4n+4){background:#1FA37A}

  .badge {
    margin-top: 40px;
    font-family: 'Anton', sans-serif; letter-spacing: 6px; font-size: 30px;
    background: var(--ember); color: var(--char);
    padding: 10px 28px; transform: rotate(-3deg);
    box-shadow: 6px 6px 0 var(--chili);
  }
  .brand {
    margin-top: 30px; text-align: center; line-height: .85;
    font-family: 'Anton', sans-serif; text-transform: uppercase;
  }
  .brand .cuu { font-size: 250px; color: var(--cream); letter-spacing: 4px;
    text-shadow: 0 0 40px rgba(255,77,0,.45), 8px 8px 0 var(--fire); }
  .brand .tacos { font-family: 'Pacifico', cursive; text-transform: none;
    font-size: 130px; color: var(--ember); margin-top: -30px; display: block;
    transform: rotate(-4deg); text-shadow: 5px 5px 0 var(--chili); }
  .sub {
    margin-top: 34px; font-weight: 800; font-size: 34px; letter-spacing: 5px;
    text-transform: uppercase; color: var(--cream);
  }
  .sub b { color: var(--fire); }

  .announce {
    margin-top: 50px; width: 100%;
    background: var(--cream); color: var(--char);
    border-radius: 28px; padding: 36px 40px 40px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    position: relative;
  }
  .announce h2 { font-family: 'Anton', sans-serif; font-size: 60px; text-transform: uppercase;
    letter-spacing: 1px; line-height: 1; }
  .announce h2 em { font-style: normal; color: var(--fire); }
  .days { display: flex; justify-content: center; gap: 16px; margin-top: 28px; }
  .day {
    width: 92px; height: 92px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Anton', sans-serif; font-size: 44px;
    border: 4px dashed #cdbfa8; color: #b9a98f;
  }
  .day.on { background: var(--fire); border: 4px solid var(--fire); color: #fff;
    box-shadow: 0 8px 0 var(--chili); }
  .range { margin-top: 26px; font-weight: 800; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; }

  .loc {
    margin-top: 46px; display: flex; align-items: center; gap: 22px;
    font-family: 'Anton', sans-serif; font-size: 58px; text-transform: uppercase; letter-spacing: 2px;
  }
  .loc svg { width: 64px; height: 64px; flex: none; }
  .loc small { display: block; font-family: 'Inter'; font-weight: 700; font-size: 24px;
    letter-spacing: 6px; color: var(--ember); }

  .flames { position: absolute; bottom: -10px; left: 0; width: 100%; height: 170px; }
</style>
</head>
<body>
<div class="flyer">
  <div class="picado"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <div class="badge">¡NUEVO HORARIO!</div>

  <div class="brand">
    <div class="cuu">CUU</div>
    <span class="tacos">Tacos</span>
  </div>

  <div class="sub">Carne asada <b>al carbón</b></div>

  <div class="announce">
    <h2>Ya estamos abiertos<br><em>de jueves a domingo</em></h2>
    <div class="days">
      <div class="day">L</div><div class="day">M</div><div class="day">M</div>
      <div class="day on">J</div><div class="day on">V</div><div class="day on">S</div><div class="day on">D</div>
    </div>
    <div class="range">¡Te esperamos con el carbón prendido!</div>
  </div>

  <div class="loc">
    <svg viewBox="0 0 24 24" fill="#FF4D00"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
    <div><small>Encuéntranos en</small>Av. Zaragoza</div>
  </div>

  <svg class="flames" viewBox="0 0 1080 170" preserveAspectRatio="none">
    <path fill="#C8102E" d="M0 170 V110 Q40 40 70 100 Q100 20 140 90 Q170 30 210 95 Q250 10 290 85 Q330 40 360 100 Q400 20 440 80 Q480 30 520 95 Q560 0 600 85 Q640 40 680 100 Q720 20 760 90 Q800 30 840 95 Q880 10 920 85 Q960 40 1000 100 Q1040 30 1080 90 V170Z"/>
    <path fill="#FF4D00" d="M0 170 V130 Q50 70 90 125 Q130 60 170 120 Q210 70 250 125 Q290 50 330 120 Q370 75 410 128 Q450 55 490 120 Q530 70 570 125 Q610 50 650 120 Q690 75 730 128 Q770 55 810 120 Q850 70 890 125 Q930 50 970 120 Q1010 75 1080 125 V170Z"/>
    <path fill="#FFB800" d="M0 170 V150 Q60 110 110 148 Q170 105 220 150 Q280 110 330 148 Q390 105 440 150 Q500 110 550 148 Q610 105 660 150 Q720 110 770 148 Q830 105 880 150 Q940 110 990 148 Q1040 115 1080 145 V170Z"/>
  </svg>
</div>
</body>
</html>
