<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<title>CUU Tacos — Flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Bebas+Neue&family=Yellowtail&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Paleta CUU Studio */
  :root {
    --bg: #0D0A11;
    --pink: #FA6ABE;
    --lilac: #C88DF0;
    --sky: #36C5F4;
    --deep: #6A2D8F;
    --white: #FFFFFF;
    --muted: #A99BB8;
    --grad: linear-gradient(90deg, var(--pink) 0%, var(--lilac) 55%, var(--sky) 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; }
  .flyer {
    width: 1080px; height: 1350px; position: relative; overflow: hidden; color: var(--white);
    background:
      radial-gradient(circle at 74% 44%, rgba(200,141,240,.38), transparent 32%),
      radial-gradient(circle at 92% 22%, rgba(250,106,190,.30), transparent 30%),
      radial-gradient(circle at 60% 72%, rgba(54,197,244,.22), transparent 30%),
      radial-gradient(ellipse 60% 40% at 0% 0%, rgba(89,42,76,.85), transparent 70%),
      var(--bg);
  }
  .abs { position: absolute; }

  /* Tacos recortados */
  .tacos-img { right: -150px; top: 215px; width: 610px; transform: rotate(-10deg);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.65));
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 90%, transparent 100%), linear-gradient(to right, transparent 0%, #000 14%);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 90%, transparent 100%), linear-gradient(to right, transparent 0%, #000 14%);
            mask-composite: intersect; }

  .label { left: 80px; top: 70px; display: flex; align-items: center; gap: 14px;
    font-family: 'Space Mono', monospace; font-size: 24px; letter-spacing: 6px; color: var(--pink); text-transform: uppercase; }
  .label::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); }

  /* Logo */
  .brand { left: 70px; top: 140px; line-height: .85; }
  .brand .cuu { font-family: 'Anton', sans-serif; font-size: 220px; letter-spacing: 4px; color: var(--white);
    text-shadow: 0 0 40px rgba(250,106,190,.5), 8px 8px 0 var(--pink); }
  .brand .tacos { font-family: 'Pacifico', cursive; font-size: 124px; display: inline-block;
    margin: -44px 0 0 60px; padding: 0 24px 12px; transform: rotate(-5deg);
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(5px 5px 0 var(--deep)); }

  .headline { left: 80px; top: 500px; }
  .headline h2 { font-family: 'Yellowtail', cursive; font-weight: 400; font-size: 72px; line-height: 1; color: #FFE6F4;
    text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink), 0 0 44px rgba(250,106,190,.7); }
  .headline p { margin-top: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 6px; color: var(--sky); }

  .cuts { left: 80px; top: 650px; }
  .cuts div { display: flex; align-items: center; gap: 22px; font-family: 'Bebas Neue', sans-serif; font-size: 78px; line-height: 1.05; letter-spacing: 2px; }
  .cuts span { width: 18px; height: 18px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 14px rgba(200,141,240,.8); }

  /* Parte de abajo */
  .rule { left: 80px; right: 80px; top: 1000px; height: 3px; background: var(--grad); }
  .days { left: 74px; top: 1030px; font-family: 'Anton', sans-serif; font-size: 132px; line-height: 1; text-transform: uppercase; letter-spacing: 1px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .info { left: 80px; right: 80px; top: 1200px; display: flex; justify-content: space-between; align-items: flex-end; }
  .info .k { font-family: 'Space Mono', monospace; font-size: 20px; letter-spacing: 5px; color: var(--muted); text-transform: uppercase; }
  .info .v { font-family: 'Bebas Neue', sans-serif; font-size: 66px; line-height: 1; margin-top: 6px; letter-spacing: 1px; }
  .info .r { text-align: right; }
</style>
</head>
<body>
<div class="flyer">
  <img class="abs tacos-img" src="tacos-cut.png" alt="Tacos de carne asada">

  <div class="abs label">¡Ya abrimos!</div>

  <div class="abs brand">
    <div class="cuu">CUU</div>
    <span class="tacos">Tacos</span>
  </div>

  <div class="abs headline">
    <h2>Tacos de carne asada</h2>
    <p>¡Pura carne selecta!</p>
  </div>

  <div class="abs cuts">
    <div><span></span>Bistec</div>
    <div><span></span>Sirloin</div>
    <div><span></span>Arrachera</div>
  </div>

  <div class="abs rule"></div>
  <div class="abs days">Jueves a domingo</div>
  <div class="abs info">
    <div><div class="k">Horario</div><div class="v">6 PM – 12 AM</div></div>
    <div class="r"><div class="k">Encuéntranos en</div><div class="v">Av. Zaragoza #12</div></div>
  </div>
</div>
</body>
</html>
