<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1640px;height:924px;overflow:hidden;background:#000;position:relative;font-family:'Saira',sans-serif}
.bg{position:absolute;inset:0;background:url(bg-fb.jpg) center/cover}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 46%,rgba(0,0,0,.55),transparent 70%)}
.logo{position:absolute;left:50%;top:395px;height:480px;width:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 0 40px rgba(215,20,26,.5)) drop-shadow(0 20px 30px rgba(0,0,0,.8))}
.tag{position:absolute;left:50%;top:648px;transform:translateX(-50%) skewX(-14deg);background:#D7141A;padding:10px 34px;white-space:nowrap;box-shadow:8px 8px 0 #FFC20E}
.tag span{display:block;transform:skewX(14deg);color:#fff;font-style:italic;font-weight:900;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.tag b{color:#FFC20E;padding:0 .3em}
.sub{position:absolute;left:0;right:0;top:724px;text-align:center;color:#fff;font-style:italic;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 10px #000}
.sub b{color:#FFC20E}
</style></head><body>
<div class="bg"></div><div class="vig"></div>
<img class="logo" src="logo.png">
<div class="tag"><span>Restauración<b>/</b>Pintura<b>/</b>Tapicería<b>/</b>Quemacocos</span></div>
<div class="sub">Iluminación <b>·</b> Accesorios <b>·</b> Refacciones <b>·</b> Suspensiones</div>
</body></html>
