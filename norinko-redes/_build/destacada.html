<style>
*{margin:0;padding:0;box-sizing:border-box}

svg{width:400px;height:400px;color:#fff;filter:drop-shadow(0 0 30px rgba(225,6,0,.55));margin-top:-40px}
.lbl{position:absolute;bottom:165px;left:0;right:0;text-align:center;color:#FFB400;font-size:92px;letter-spacing:.08em}
