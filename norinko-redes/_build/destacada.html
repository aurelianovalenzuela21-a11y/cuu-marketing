*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#D7141A;display:grid;place-items:center;overflow:hidden;font-family:'Saira',sans-serif}
.bg{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(0,0,0,.06) 70px 72px),radial-gradient(circle at 50% 50%,rgba(255,255,255,.18),transparent 45%)}
.badge{position:relative;width:900px;height:900px;border-radius:50%;background:#fff;display:grid;place-items:center;
 box-shadow:0 0 0 22px #FFC20E,0 0 0 30px #141414,0 40px 80px rgba(0,0,0,.35)}
.icon svg{width:420px;height:420px;color:#D7141A;margin-top:-90px}
.lbl{position:absolute;bottom:150px;left:50%;transform:translateX(-50%) skewX(-12deg);background:#FFC20E;padding:10px 46px;white-space:nowrap}
.lbl span{display:block;transform:skewX(12deg);font-style:italic;font-weight:900;font-size:84px;line-height:1;color:#141414;text-transform:uppercase;letter-spacing:.01em}
