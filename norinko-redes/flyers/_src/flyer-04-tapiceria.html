<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lanzamiento/_src/fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Barlow',sans-serif;color:#fff;
 background:radial-gradient(120% 70% at 100% 0%,rgba(215,20,26,.35),transparent 60%),linear-gradient(180deg,#1b1b1b,#0e0e0e)}
.slash{position:absolute;right:-120px;top:-60px;width:420px;height:1500px;background:linear-gradient(180deg,rgba(215,20,26,.16),rgba(215,20,26,0));transform:skewX(-18deg)}
.top{position:absolute;left:60px;right:60px;top:52px;display:flex;justify-content:space-between;align-items:center}
.top img{height:86px}
.handle{font-family:'Saira';font-style:italic;font-weight:800;font-size:22px;letter-spacing:.06em;color:rgba(255,255,255,.8)}
.head{position:absolute;left:60px;right:60px;top:170px}
.kicker{display:inline-flex;align-items:center;gap:14px;font-family:'Saira';font-style:italic;font-weight:800;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:#FFC20E}
.kicker i{width:46px;height:10px;background:linear-gradient(90deg,#D7141A 0 50%,#FFC20E 50%);transform:skewX(-24deg)}
.title{font-family:'Saira';font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;font-size:94px;margin-top:16px}
.title span{color:#FFC20E}
.photo{position:absolute;left:60px;right:60px;top:440px;height:590px;background-size:cover;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.55);border-bottom:8px solid #D7141A}
.photo::after{content:'';position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.45))}
.tag{position:absolute;left:-14px;top:28px;z-index:2;background:#D7141A;color:#fff;font-family:'Saira';font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.04em;padding:10px 26px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.real{position:absolute;right:18px;bottom:18px;z-index:2;font-family:'Saira';font-style:italic;font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.sub{position:absolute;left:60px;right:60px;top:1060px;font-size:29px;line-height:1.35;font-weight:500;color:rgba(255,255,255,.9)}
.foot{position:absolute;left:60px;right:60px;bottom:58px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-family:'Saira';font-style:italic;font-weight:800;font-size:21px;text-transform:uppercase;padding:9px 15px;background:rgba(255,255,255,.07);border-left:6px solid #FFC20E}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:12px;background:#D7141A;color:#fff;font-family:'Saira';font-style:italic;font-weight:900;font-size:30px;text-transform:uppercase;padding:18px 30px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,#D7141A 0 70%,#FFC20E 70%)}
</style></head><body>
